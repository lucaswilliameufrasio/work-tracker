[package]
name = "puxiri"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[dependencies]
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive", "env"] }
mime_guess = "2.0.5"
rust-embed = { version = "8.12.0", features = ["debug-embed"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "2.0"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
tower-http = { version = "0.7.1", features = ["set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.0", features = ["v7"] }

[dev-dependencies]
openidconnect = { version = "=4.0.1", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
aws-sdk-sesv2 = { version = "=1.123.0", default-features = false, features = ["rt-tokio", "default-https-client"] }
http-body-util = "0.1"
base64 = "=0.22.1"
openssl = "=0.10.81"
time = { version = "=0.3.55", features = ["parsing"] }
p256 = { version = "=0.14.0", default-features = false, features = ["ecdsa", "pkcs8", "std"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["json"] }
rusqlite = { version = "=0.39.0", features = ["backup", "bundled"] }
tempfile = "3.27.0"
standardwebhooks = "=1.0.1"
tokio = { version = "1.53.2", features = ["io-util"] }
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
strip = true

[lints.rust]
unsafe_code = "forbid"
